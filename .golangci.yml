version: "2"
formatters:
  enable:
    - gofumpt
    - goimports
linters:
  enable:
    - goconst
    - gocritic
    - gosec
    - misspell
  exclusions:
    rules:
      - linters:
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - gosec
        text: "G117"
        path: (ethereum_wallet|session)\.go
