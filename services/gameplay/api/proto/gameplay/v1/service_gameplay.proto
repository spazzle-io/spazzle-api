syntax = "proto3";

package gameplay.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "gameplay/v1/rpc_server_service.proto";
import "gameplay/v1/rpc_server_admin_service.proto";
import "gameplay/v1/rpc_word_service.proto";
import "gameplay/v1/rpc_game_service.proto";

option go_package = "github.com/spazzle-io/spazzle-api/services/gameplay/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Gameplay Service";
    version: "0";
    contact: {
      name: "Spazzle";
      url: "https://spazzle.io";
    };
  };
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Authentication token, prefixed by Bearer: bearer <token>"
      }
    }
  };
  security: {
    security_requirement: {
      key: "bearer"
    }
  };
};

service ServerService {
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse) {
    option (google.api.http) = {
      post: "/servers",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create server";
      description: "Create a new server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc GetServer(GetServerRequest) returns (GetServerResponse) {
    option (google.api.http) = {
      get: "/servers/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get server";
      description: "Get server by id";
      security: {};
    };
  }

  rpc GetServerByName(GetServerByNameRequest) returns (GetServerByNameResponse) {
    option (google.api.http) = {
      get: "/servers/by-name/{name}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get server by name";
      description: "Get server name";
      security: {};
    };
  }

  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option (google.api.http) = {
      get: "/servers"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List servers";
      description: "List all servers";
      security: {};
    };
  }

  rpc ListUserServers(ListUserServersRequest) returns (ListUserServersResponse) {
    option (google.api.http) = {
      get: "/servers/by-user/{user_id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List user servers";
      description: "List servers for which a user has elevated privileges";
      security: {};
    };
  }

  rpc GetUserServerPermissions(GetUserServerPermissionsRequest) returns (GetUserServerPermissionsResponse) {
    option (google.api.http) = {
      get: "/servers/{server_id}/permissions/{user_id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a user's server permissions";
      description: "Check whether a user has elevated privileges on a server";
      security: {};
    };
  }

  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse) {
    option (google.api.http) = {
      patch: "/servers/{server_id}",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update server";
      description: "Update server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc JoinServer(JoinServerRequest) returns (JoinServerResponse) {
    option (google.api.http) = {
      post: "/servers/{server_id}/join",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Join server";
      description: "Join server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc ArchiveServer(ArchiveServerRequest) returns (ArchiveServerResponse) {
    option (google.api.http) = {
      post: "/servers/{server_id}/archive",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Archive server";
      description: "Archive server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }
}

service ServerAdminService {
  rpc AddServerAdmin(AddServerAdminRequest) returns (AddServerAdminResponse) {
    option (google.api.http) = {
      post: "/servers/{server_id}/admins",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Add a server administrator";
      description: "Add a server administrator";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc ListServerAdmins(ListServerAdminsRequest) returns (ListServerAdminsResponse) {
    option (google.api.http) = {
      get: "/servers/{server_id}/admins"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List server administrators";
      description: "List server administrators";
      security: {};
    };
  }

  rpc RemoveServerAdmin(RemoveServerAdminRequest) returns (RemoveServerAdminResponse) {
    option (google.api.http) = {
      delete: "/servers/{server_id}/admins/{user_id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove a server administrator";
      description: "Remove a server administrator";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }
}

service WordService {
  rpc AddWords(AddWordsRequest) returns (AddWordsResponse) {
    option (google.api.http) = {
      post: "/servers/{server_id}/words",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Add words to a given server";
      description: "Add words to a given server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc GetRandomWords(GetRandomWordsRequest) returns (GetRandomWordsResponse) {
    option (google.api.http) = {
      get: "/servers/{server_id}/words:random"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get random words from a server";
      description: "Get random words from a server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc ListWords(ListWordsRequest) returns (ListWordsResponse) {
    option (google.api.http) = {
      get: "/servers/{server_id}/words"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List server words";
      description: "List server words";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc RemoveWords(RemoveWordsRequest) returns (RemoveWordsResponse) {
    option (google.api.http) = {
      post: "/servers/{server_id}/words:remove",
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove words from a server";
      description: "Remove words from a server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }

  rpc RemoveAllWords(RemoveAllWordsRequest) returns (RemoveAllWordsResponse) {
    option (google.api.http) = {
      delete: "/servers/{server_id}/words"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove all words from a server";
      description: "Remove all words from a server";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }
}

service GameService {
  rpc ReplayGame(ReplayGameRequest) returns (ReplayGameResponse) {
    option (google.api.http) = {
      get: "/servers/{server_id}/games/{game_id}/replay"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Replay game";
      description: "Replay game events from a specific point in a game's event stream";
      security: {
        security_requirement: {
          key: "bearer"
        }
      };
    };
  }
}
