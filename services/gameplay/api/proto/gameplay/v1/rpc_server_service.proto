syntax = "proto3";

package gameplay.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/spazzle-io/spazzle-api/services/gameplay/pb";

message CreateServerRequest {
  string user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).required = true];
  string server_address = 3 [(buf.validate.field).required = true];
  bool is_publicly_visible = 4;
  string stake_per_game = 5 [(buf.validate.field).required = true];
  int32 num_rounds_per_game = 6 [(buf.validate.field).required = true];
  int32 round_duration_secs = 7 [(buf.validate.field).required = true];
  int32 num_drawing_options = 8 [(buf.validate.field).required = true];
}

message CreateServerResponse {
  Server server = 1;
}

message GetServerRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetServerResponse {
  Server server = 1;
}

message GetServerByNameRequest {
  string name = 1 [(buf.validate.field).required = true];
}

message GetServerByNameResponse {
  Server server = 1;
}

message ListServersRequest {
  google.protobuf.Timestamp after_created_at = 1;
  string after_id = 2;
  int32 page_size = 3;
}

message ListServersResponse {
  repeated Server servers = 1;
  int64 total_count = 2;
  ListServersCursor cursor = 3;
}

message ListUserServersRequest {
  string user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp after_created_at = 2;
  string after_id = 3;
  int32 page_size = 4;
}

message ListUserServersResponse {
  string user_id = 1;
  repeated UserServer servers = 2;
  int64 total_count = 3;
  ListServersCursor cursor = 4;
}

message Server {
  string id = 1;
  string name = 2;
  string owner_id = 3;
  int32 num_admins = 4;
  int32 num_custom_words = 5;
  bool is_publicly_visible = 6;
  string server_address = 7;
  string stake_per_game = 8;
  int32 num_rounds_per_game = 9;
  int32 round_duration_secs = 10;
  int32 num_drawing_options = 11;
  bool is_archived = 12;
  google.protobuf.Timestamp archived_at = 13;
  google.protobuf.Timestamp created_at = 14;
}

message UserServer {
  string id = 1;
  string name = 2;
  string owner_id = 3;
  int32 num_admins = 4;
  int32 num_custom_words = 5;
  bool is_publicly_visible = 6;
  string server_address = 7;
  string stake_per_game = 8;
  int32 num_rounds_per_game = 9;
  int32 round_duration_secs = 10;
  int32 num_drawing_options = 11;
  bool is_archived = 12;
  bool is_owner = 13;
  bool is_admin = 14;
  google.protobuf.Timestamp archived_at = 15;
  google.protobuf.Timestamp created_at = 16;
}

message ListServersCursor {
  google.protobuf.Timestamp after_created_at = 1;
  string after_id = 2;
  int32 page_size = 3;
}
