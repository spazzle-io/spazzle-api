syntax = "proto3";

package gameplay.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/spazzle-io/spazzle-api/services/gameplay/pb";

message GetCurrentGameRequest {
  string server_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetCurrentGameResponse {
  CurrentGameInfo game = 1;
}

message GetGameRequest {
  string game_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetGameResponse {
  GameInfo game = 1;
}

message GetGameLeaderboardRequest {
  string game_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int32 page = 2;
}

message GetGameLeaderboardResponse {
  repeated GamePlayerEntry players = 1;
  int64 total_count = 2;
  int32 page = 3;
}

message ListServerGamesRequest {
  string server_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  google.protobuf.Int32Value page_size = 2;
  google.protobuf.Timestamp after_ended_at = 3;
  google.protobuf.StringValue after_id = 4;
}

message ListServerGamesResponse {
  repeated GameInfo games = 1;
  int64 total_count = 2;
  GamesCursor cursor = 3;
}

message GetServerLeaderboardRequest {
  string server_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  TimeWindow time_window = 2;
  int32 page = 3;
}

message GetServerLeaderboardResponse {
  repeated LeaderboardEntry players = 1;
  int64 total_count = 2;
  TimeWindow time_window = 3;
  int32 page = 4;
}

message ListUserGamesRequest {
  string user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  google.protobuf.Int32Value page_size = 2;
  google.protobuf.Timestamp after_ended_at = 3;
  google.protobuf.StringValue after_id = 4;
}

message ListUserGamesResponse {
  repeated UserGameEntry games = 1;
  int64 total_count = 2;
  GamesCursor cursor = 3;
}

message GetGlobalLeaderboardRequest {
  TimeWindow time_window = 1;
  int32 page = 2;
}

message GetGlobalLeaderboardResponse {
  repeated LeaderboardEntry players = 1;
  int64 total_count = 2;
  TimeWindow time_window = 3;
  int32 page = 4;
}

message GetUserStatsRequest {
  string user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetUserStatsResponse {
  string user_id = 1;
  int32 total_games = 2;
  int32 total_score = 3;
  string total_pnl = 4;
  string total_volume = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ReplayGameRequest {
  string server_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string game_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  StreamType stream_type = 3 [(buf.validate.field).required = true];
  uint32 round_number = 4 [(buf.validate.field).uint32 = {gte: 0, lte: 255}];
  string after = 5;
  int32 limit = 6 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
}

message ReplayGameResponse {
  repeated ReplayMessage messages = 1;
  bool has_more = 2;
  string last_id = 3;
}

message JoinGameRequest {
  string server_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  GameRole role = 2 [(buf.validate.field).required = true];
}

message JoinGameResponse {
  JoinGameStatus status = 1;
  string user_id = 2;
  string game_id = 3;
  string join_code = 4;
  google.protobuf.Timestamp join_code_expires_at = 5;
  int64 retry_after_ms = 6;
}

enum GameRole {
  GAME_ROLE_UNSPECIFIED = 0;
  GAME_ROLE_PLAYER = 1;
  GAME_ROLE_SPECTATOR = 2;
  GAME_ROLE_MODERATOR = 3;
}

enum StreamType {
  STREAM_TYPE_UNSPECIFIED = 0;
  STREAM_TYPE_GAME_EVENTS = 1;
  STREAM_TYPE_DRAWING_UPDATES = 2;
}

enum TimeWindow {
  TIME_WINDOW_UNSPECIFIED = 0;
  TIME_WINDOW_TODAY = 1;
  TIME_WINDOW_WEEKLY = 2;
  TIME_WINDOW_MONTHLY = 3;
  TIME_WINDOW_ALL_TIME = 4;
}

enum JoinGameStatus {
  JOIN_GAME_STATUS_UNSPECIFIED = 0;
  JOIN_GAME_STATUS_SUCCESS = 1;
  JOIN_GAME_STATUS_GAME_ENDING = 2;
}

message GameInfo {
  string id = 1;
  string server_id = 2;
  int32 num_rounds = 3;
  int32 num_players = 4;
  string total_pot = 5;
  string stake_per_game = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
}

message CurrentGameInfo {
  string id = 1;
  string phase = 2;
  string sub_phase = 3;
  uint32 current_round = 4;
  uint32 num_rounds = 5;
  string current_artist = 6;
  int32 num_players = 7;
  google.protobuf.Timestamp started_at = 8;
  int64 drawing_duration_ms = 9;
  string stake_per_game = 10;
}

message GamePlayerEntry {
  string user_id = 1;
  int32 score = 2;
  string pnl = 3;
  int32 position = 4;
  int32 rounds_played = 5;
  string provisional_payout = 6;
  string total_stake_lost = 7;
  bool is_evicted = 8;
}

message LeaderboardEntry {
  string user_id = 1;
  int32 total_games = 2;
  int32 total_score = 3;
  string total_pnl = 4;
  string total_volume = 5;
}

message UserGameEntry {
  GameInfo game = 1;
  int32 score = 2;
  string pnl = 3;
  string provisional_payout = 4;
  string stake_lost = 5;
  int32 position = 6;
  int32 rounds_played = 7;
  bool is_evicted = 8;
}

message ReplayMessage {
  string id = 1;
  string type = 2;
  google.protobuf.Timestamp timestamp = 3;
  StreamType stream_type = 4;
  google.protobuf.Struct payload = 5;
  string correlation_id = 6;
}

message GamesCursor {
  google.protobuf.Timestamp after_ended_at = 1;
  string after_id = 2;
  int32 page_size = 3;
}
