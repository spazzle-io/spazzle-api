syntax = "proto3";

package users.v1;

import "buf/validate/validate.proto";
import "users/v1/common.proto";

option go_package = "github.com/spazzle-io/spazzle-api/services/users/pb";

message CreateUserRequest {
  string wallet_address = 1 [(buf.validate.field).required = true];
  string gamer_tag = 2;
  string signature = 3 [(buf.validate.field).required = true];
}

message CreateUserResponse {
  User user = 1;
  Session session = 2;
}
