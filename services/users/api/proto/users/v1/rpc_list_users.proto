syntax = "proto3";

package users.v1;

import "users/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/spazzle-io/spazzle-api/services/users/pb";

message ListUsersRequest {
  google.protobuf.Timestamp after_created_at = 1;
  google.protobuf.StringValue after_id = 2;
  google.protobuf.Int32Value page_size = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total_count = 2;
  ListUsersCursor cursor = 3;
}

message ListUsersCursor {
  google.protobuf.Timestamp after_created_at = 1;
  string after_id = 2;
  int32 page_size = 3;
}
